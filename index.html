<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartera CEDEAR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3;--panel:#FFFFFF;--panel2:#F4F6F9;--ink:#17202A;--muted:#5D6976;--faint:#8A95A1;--line:#DCE2E8;
  --accent:#2F5BD3;--on-accent:#FFFFFF;--accent-soft:rgba(47,91,211,.09);
  --gain:#15845A;--gain-soft:rgba(21,132,90,.11);--loss:#C23B3B;--loss-soft:rgba(194,59,59,.10);--warn:#A86C12;--warn-soft:rgba(168,108,18,.10);
  --shadow:0 1px 2px rgba(23,32,42,.06);--pop:0 12px 32px rgba(23,32,42,.14);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151B;--panel:#171E26;--panel2:#1D252E;--ink:#E3E9EF;--muted:#98A4B0;--faint:#6D7986;--line:#28323D;
    --accent:#86A3F7;--on-accent:#0F1622;--accent-soft:rgba(134,163,247,.13);
    --gain:#43C28B;--gain-soft:rgba(67,194,139,.13);--loss:#F07070;--loss-soft:rgba(240,112,112,.12);--warn:#E2A94F;--warn-soft:rgba(226,169,79,.12);
    --shadow:none;--pop:0 14px 36px rgba(0,0,0,.45);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151B;--panel:#171E26;--panel2:#1D252E;--ink:#E3E9EF;--muted:#98A4B0;--faint:#6D7986;--line:#28323D;
  --accent:#86A3F7;--on-accent:#0F1622;--accent-soft:rgba(134,163,247,.13);
  --gain:#43C28B;--gain-soft:rgba(67,194,139,.13);--loss:#F07070;--loss-soft:rgba(240,112,112,.12);--warn:#E2A94F;--warn-soft:rgba(226,169,79,.12);
  --shadow:none;--pop:0 14px 36px rgba(0,0,0,.45);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Inter Tight',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.up{color:var(--gain)}.down{color:var(--loss)}

.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;padding:22px 12px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;padding:2px 10px 20px}
.brand svg{flex:none}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500;border:1px solid transparent}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.nav .n{font-size:12.5px;color:var(--faint);font-weight:500}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--faint);padding:0 10px;display:flex;gap:7px;align-items:center}
.side-foot i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.side-foot i.ok{background:var(--gain)}

main{min-width:0;padding:0 32px 56px;max-width:1240px;width:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.top .ttl{font-size:15px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:10px}
.top .ttl .mb{display:none}
.fx{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--panel);white-space:nowrap}
.chip span{color:var(--muted)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--loss)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon{border:0;background:none;color:var(--faint);padding:4px 6px;border-radius:6px;font-size:13px}
.icon:hover{color:var(--ink);background:var(--panel2)}
.warnlink{border:1px dashed var(--warn);color:var(--warn);background:var(--warn-soft)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:-8px 0 22px;font-size:14px}

.hero{display:grid;gap:8px;margin:4px 0 24px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-size:clamp(36px,6vw,56px);font-weight:600;letter-spacing:-.035em;line-height:1}
.hero .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:13.5px;font-weight:600}
.tag.up{background:var(--gain-soft)}.tag.down{background:var(--loss-soft)}

.lens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.lens .opt{text-align:left;padding:15px 18px 16px;border:0;border-right:1px solid var(--line);background:none;display:grid;gap:3px;position:relative;color:var(--ink)}
.lens .opt:last-child{border-right:0}
.lens .opt:hover{background:var(--panel2)}
.lens .opt.on{background:var(--accent-soft)}
.lens .opt.on::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.lens .k{font-size:13px;color:var(--muted);font-weight:500}
.lens .v{font-size:21px;font-weight:600;letter-spacing:-.015em}
.lens .r{font-size:13.5px}
.note{font-size:13.5px;color:var(--muted);margin:10px 2px 0;max-width:78ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px 28px;margin:28px 0 26px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-size:19px;font-weight:600;margin-top:2px;letter-spacing:-.01em}
.kpi .s{font-size:13px;margin-top:1px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0;margin-bottom:16px}
.grid2 .card{margin-bottom:0}
.card h2{font-size:15px;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{margin-left:auto}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:16px;height:2px;border-radius:2px;background:var(--accent)}
.lg-dash{width:16px;height:0;border-top:2px dashed var(--faint)}
.lg-dot{width:9px;height:9px;border-radius:50%}

.chart{position:relative;min-height:60px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--faint);font-size:11px;font-family:inherit}
.chart .cross{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 3}
.empty-chart{display:grid;place-items:center;text-align:center;min-height:180px;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px;padding:20px}
.tip{position:absolute;top:0;left:0;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;box-shadow:var(--pop);white-space:nowrap;z-index:4;display:none;line-height:1.5}
.tip b{font-weight:600}
.tip .d{color:var(--muted);margin-bottom:2px}

.tbl{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th:last-child,td:last-child{padding-right:0}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:1px solid var(--line);border-bottom:0;font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
td.l,th.l{text-align:left}
.tk{display:flex;align-items:center;gap:10px}
.tk .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tk b{font-weight:600}
.tk span{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--panel2);color:var(--muted)}
.badge.buy{background:var(--gain-soft);color:var(--gain)}
.badge.sell{background:var(--loss-soft);color:var(--loss)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}

.bars{display:grid;gap:11px}
.bar{display:grid;grid-template-columns:64px minmax(0,1fr) 108px;align-items:center;gap:12px;font-size:13.5px}
.bar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{position:relative;height:10px;background:var(--panel2);border-radius:5px}
.bar .fill{position:absolute;top:0;bottom:0;border-radius:5px}
.bar .zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--faint)}
.bar .val{text-align:right;font-weight:600}
.bar .val small{display:block;color:var(--muted);font-weight:400;font-size:12px}

.donut{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut svg{flex:none}
.donut .c1{fill:var(--muted);font-size:11px}
.donut .c2{fill:var(--ink);font-size:15px;font-weight:600}
.dl{display:grid;gap:7px;flex:1;min-width:180px;font-size:13.5px}
.dl div{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center}
.dl i{width:9px;height:9px;border-radius:50%}
.dl .p{color:var(--muted);min-width:46px;text-align:right}

.empty{text-align:center;padding:56px 20px;max-width:560px;margin:0 auto}
.empty h2{font-size:24px;letter-spacing:-.02em;margin:0 0 8px}
.empty p{color:var(--muted);margin:0 0 22px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.dhead{display:flex;align-items:flex-end;gap:14px 20px;flex-wrap:wrap;margin-bottom:22px}
.dhead .t{font-size:42px;font-weight:700;letter-spacing:-.035em;line-height:.95;display:flex;align-items:center;gap:12px}
.dhead .t i{width:12px;height:12px;border-radius:50%}
.dhead .nm{color:var(--muted);font-size:15px;padding-bottom:3px}
.dhead .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:14px}
.back:hover{color:var(--ink)}

.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.vin{display:grid;gap:4px;align-content:start}
.vin label{font-size:12.5px;color:var(--muted)}
.vout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px 18px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.vout .k{font-size:12.5px;color:var(--muted)}
.vout .v{font-size:17px;font-weight:600}
.vout .s{font-size:12.5px;color:var(--muted)}
.gauge{margin-top:18px}
.gauge .tr{position:relative;height:8px;background:var(--panel2);border-radius:4px;margin:26px 0 22px}
.gauge .seg-ok{position:absolute;top:0;bottom:0;left:0;background:var(--gain-soft);border-radius:4px 0 0 4px}
.gauge .pin{position:absolute;top:50%;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--ink);border:3px solid var(--panel)}
.gauge .tgt{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--accent);transform:translateX(-1px)}
.gauge .lab{position:absolute;font-size:12px;white-space:nowrap;transform:translateX(-50%)}
.gauge .lab.a{bottom:16px}.gauge .lab.b{top:16px;color:var(--accent)}

.mets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.met{background:var(--panel2);border-radius:10px;padding:10px 12px;position:relative;min-width:0}
.met .k{font-size:12.5px;color:var(--muted);padding-right:16px;overflow-wrap:anywhere}
.met .v{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.met .icon{position:absolute;top:4px;right:4px;padding:2px 6px}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input{flex:1;min-width:110px}
textarea{resize:vertical;min-height:84px;line-height:1.5}

input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--faint)}

.ov{position:fixed;inset:0;background:rgba(9,13,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 6vh) 14px calc(env(safe-area-inset-bottom,0px) + 24px);z-index:60;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(580px,100%);padding:22px 22px 20px;box-shadow:var(--pop)}
.modal h3{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}
.modal .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.f{display:grid;gap:5px;grid-column:span 6;align-content:start}
.f.s3{grid-column:span 3}.f.s2{grid-column:span 2}
.f > label{font-size:13px;color:var(--muted);font-weight:500}
.hint{font-size:12.5px;color:var(--muted)}
.err{color:var(--loss);font-size:13.5px;min-height:0}
.feebox summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:500;padding:4px 0}
.feebox[open] summary{margin-bottom:2px}
.f.s3 .feebox{padding-top:22px}
.preview{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--panel2);border-radius:9px;padding:9px 12px}
.preview b{color:var(--ink);font-weight:600}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.actions .l{margin-right:auto}
.qt{display:grid;grid-template-columns:minmax(70px,1fr) minmax(0,1.4fr) minmax(0,1.2fr);gap:8px 10px;align-items:center}
.qt .h{font-size:12.5px;color:var(--muted)}
.qt b{font-weight:600}
details.more{margin-top:14px}
details.more summary{cursor:pointer;color:var(--muted);font-size:13.5px}
.warns{border:1px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:16px}
.warns p{margin:0 0 4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.wf{display:grid;gap:12px}
.wr{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;align-items:center;gap:12px;font-size:13.5px}
.wr .nm{color:var(--muted)}
.wr .tr{position:relative;height:14px;overflow:hidden;border-radius:4px}
.convrow{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:13.5px}
.wr .fill{position:absolute;top:0;bottom:0;border-radius:4px;opacity:.9}
.wr .val{text-align:right;font-weight:600}
.wr .val small{display:block;font-weight:400;color:var(--muted);font-size:12px}
@media (max-width:640px){.wr{grid-template-columns:96px minmax(0,1fr) 100px}}
.subrow{font-size:13.5px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}
.subrow b{font-weight:600}
.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
.liqrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.5fr);gap:14px 24px;align-items:end}
.liqrow .k{font-size:13px;color:var(--muted)}.liqrow .v{font-size:19px;font-weight:600}
.liqrow .tot{padding-left:22px;border-left:1px solid var(--line)}.liqrow .s{font-size:12.5px}
a.btn{text-decoration:none;color:inherit}
@media (max-width:760px){.liqrow{grid-template-columns:repeat(3,minmax(0,1fr))}.liqrow .tot{grid-column:1/-1;padding-left:0;border-left:0;border-top:1px solid var(--line);padding-top:12px}}

.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px}
.tabbar a{flex:1;text-align:center;padding:9px 1px;font-size:11.5px;color:var(--muted);text-decoration:none;border-radius:8px;font-weight:500}
.tabbar a.on{color:var(--accent);background:var(--accent-soft)}

@media (max-width:899px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .tabbar{display:flex}
  main{padding:0 16px 100px}
  .top .ttl .mb{display:inline-flex}
}
@media (max-width:640px){
  .lens{grid-template-columns:1fr}
  .lens .opt{border-right:0;border-bottom:1px solid var(--line)}
  .lens .opt:last-child{border-bottom:0}
  .f.s3,.f.s2{grid-column:span 6}
  .vgrid{grid-template-columns:1fr}
  .bar{grid-template-columns:54px minmax(0,1fr) 96px}
  .dhead .t{font-size:34px}
  .top .fx{order:3;width:100%}
}
@media (prefers-reduced-motion:no-preference){
  .hero .big{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div id="app"></div>
<datalist id="tickers"></datalist>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k==='style') el.setAttribute('style',v);
    else if(k==='value') el.value=v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
